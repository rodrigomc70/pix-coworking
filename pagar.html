<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagar com Pix | Coworking Terapia</title>
<style>
  :root { --cor: #0f8a7e; --cor-escura: #0a5f57; --fundo: #f3f7f6; --texto: #1a2b2a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--texto); }
  .cartao { max-width: 440px; margin: 0 auto; min-height: 100vh; background: #fff; box-shadow: 0 0 30px rgba(0,0,0,.06); }
  header { background: linear-gradient(135deg, var(--cor-escura), var(--cor)); color: #fff; text-align: center; padding: 28px 16px; }
  header h1 { margin: 0; font-size: 24px; letter-spacing: .3px; }
  header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
  main { padding: 24px 20px 32px; text-align: center; }
  .rotulo { font-size: 15px; color: #4a5c5a; margin: 0 0 4px; }
  .destino { font-size: 20px; font-weight: 700; color: var(--cor); margin: 0 0 20px; }
  .valor { font-size: 34px; font-weight: 800; margin: 18px 0; }
  #qr { display: inline-block; padding: 14px; border: 3px solid var(--cor); border-radius: 16px; background: #fff; }
  #qr img, #qr canvas { display: block; }
  .instrucao { font-size: 14px; color: #4a5c5a; margin: 16px 0 8px; }
  textarea { width: 100%; height: 96px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 10px; border: 1px dashed #b9cfcc; border-radius: 10px; background: #f8fbfa; color: #33403f; resize: none; }
  button { width: 100%; margin-top: 12px; padding: 15px; font-size: 17px; font-weight: 700; color: #fff; background: var(--cor); border: 0; border-radius: 12px; cursor: pointer; }
  button:hover { background: var(--cor-escura); }
  input[type=text] { width: 100%; padding: 14px; font-size: 20px; text-align: center; border: 2px solid #b9cfcc; border-radius: 12px; }
  .erro { background: #fdecea; color: #8a1c13; border-radius: 10px; padding: 14px; font-size: 14px; text-align: left; }
  footer { font-size: 12px; color: #7b8c8a; text-align: center; padding: 0 20px 28px; }
  .oculto { display: none; }
</style>
</head>
<body>
<div class="cartao">
  <header>
    <h1 id="marca"></h1>
    <p>Pagamento via Pix</p>
  </header>
  <main>
    <div id="erro" class="erro oculto"></div>

    <form id="formValor" class="oculto">
      <p class="rotulo">Informe o valor a pagar</p>
      <input type="text" id="campoValor" inputmode="decimal" placeholder="Ex.: 60,00" autocomplete="off">
      <button type="submit">Gerar Pix</button>
    </form>

    <section id="pagamento" class="oculto">
      <p class="rotulo">Transfira para</p>
      <p class="destino" id="destino"></p>
      <div id="qr"></div>
      <div class="valor" id="valorTela"></div>
      <p class="instrucao">Abra o app do seu banco, escaneie o QR Code ou use o Pix copia e cola.</p>
      <textarea id="codigo" readonly></textarea>
      <button type="button" id="copiar">Copiar código Pix</button>
    </section>
  </main>
  <footer>O pagamento vai direto para a conta do recebedor.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// =====================================================
// CONFIGURAÇÃO: é só aqui que você mexe
// =====================================================
const CONFIG = {
  chave:  "+5561982273627", // CPF/CNPJ (só números), e-mail, telefone (+5561999999999) ou chave aleatória
  nome:   "Coworking Terapia",          // nome que aparece para quem paga (máx. 25 caracteres, sem acentos)
  cidade: "Brasilia",                   // cidade (máx. 15 caracteres, sem acentos)
  marca:  "Coworking Terapia"           // título que aparece na página
};
// =====================================================

function tlv(id, valor) { return id + String(valor.length).padStart(2, "0") + valor; }

function limpa(texto, max) {
  return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Za-z0-9 ]/g, " ").replace(/\s+/g, " ").trim().toUpperCase().slice(0, max);
}

function crc16(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, "0");
}

function montaPix(chave, nome, cidade, valor, txid) {
  const p =
    tlv("00", "01") +
    tlv("01", "11") +
    tlv("26", tlv("00", "br.gov.bcb.pix") + tlv("01", chave)) +
    tlv("52", "0000") +
    tlv("53", "986") +
    (valor ? tlv("54", valor.toFixed(2)) : "") +
    tlv("58", "BR") +
    tlv("59", limpa(nome, 25)) +
    tlv("60", limpa(cidade, 15)) +
    tlv("62", tlv("05", txid || "***")) +
    "6304";
  return p + crc16(p);
}

function lerValor(texto) {
  if (!texto) return null;
  const n = parseFloat(String(texto).replace(",", "."));
  if (!isFinite(n) || n <= 0 || n > 1000000) return NaN;
  return Math.round(n * 100) / 100;
}

function mostraErro(msg) {
  const e = document.getElementById("erro");
  e.textContent = msg;
  e.classList.remove("oculto");
}

(function iniciar() {
  document.getElementById("marca").textContent = CONFIG.marca;
  document.title = "Pagar com Pix | " + CONFIG.marca;

  if (!CONFIG.chave || CONFIG.chave.indexOf("COLOQUE_") === 0) {
    mostraErro("Falta configurar a chave Pix no topo do arquivo (campo CONFIG.chave).");
    return;
  }

  const params = new URLSearchParams(location.search);
  const valor = lerValor(params.get("valor"));
  const txid = (params.get("ref") || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 25) || "***";

  if (valor === null) {
    const form = document.getElementById("formValor");
    form.classList.remove("oculto");
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      const v = lerValor(document.getElementById("campoValor").value);
      if (v === null || isNaN(v)) { alert("Digite um valor válido, por exemplo 60,00"); return; }
      location.search = "?valor=" + v.toFixed(2);
    });
    return;
  }
  if (isNaN(valor)) { mostraErro("Valor inválido no link. Use, por exemplo: ?valor=60 ou ?valor=120.75"); return; }

  const codigo = montaPix(CONFIG.chave, CONFIG.nome, CONFIG.cidade, valor, txid);

  document.getElementById("destino").textContent = CONFIG.marca;
  document.getElementById("valorTela").textContent =
    valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  document.getElementById("codigo").value = codigo;
  document.getElementById("pagamento").classList.remove("oculto");

  new QRCode(document.getElementById("qr"), {
    text: codigo, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M
  });

  document.getElementById("copiar").addEventListener("click", function () {
    const btn = this;
    const ok = () => { btn.textContent = "Código copiado!"; setTimeout(() => btn.textContent = "Copiar código Pix", 2500); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(codigo).then(ok);
    } else {
      const ta = document.getElementById("codigo"); ta.select(); document.execCommand("copy"); ok();
    }
  });
})();
</script>
</body>
</html>
